[package]
name = "tronc"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Shared Rust HTTP chassis for Facile Suite APIs, a port of Go tronc"
repository = "https://github.com/FacileStudio/tronc-rs"
publish = false

[features]
default = []
http = ["dep:axum", "dep:tower", "dep:futures-util", "dep:flate2", "dep:getrandom", "dep:http-body-util"]
health = ["http", "dep:sqlx", "dep:tokio"]
spa = ["http", "dep:tower-http", "dep:sha2", "dep:base64", "dep:percent-encoding"]
migrate = ["dep:sqlx"]
testdb = ["migrate"]
journal = ["dep:ureq", "dep:time"]

[dependencies]
http = "1.5.0"
ipnet = "2.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
axum = { version = "0.8.9", optional = true, default-features = false, features = ["json", "tokio", "http1", "http2", "query"] }
base64 = { version = "0.23.1", optional = true }
flate2 = { version = "1.1.11", optional = true }
futures-util = { version = "0.3.34", optional = true, default-features = false, features = ["std"] }
getrandom = { version = "0.4.3", optional = true }
http-body-util = { version = "0.1.5", optional = true }
percent-encoding = { version = "2.3.2", optional = true }
sha2 = { version = "0.11.1", optional = true }
sqlx = { version = "0.9.0", optional = true, default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate"] }
time = { version = "0.3.55", optional = true, features = ["formatting"] }
tokio = { version = "1.54.1", optional = true, features = ["time"] }
tower = { version = "0.5.3", optional = true, features = ["util"] }
tower-http = { version = "0.7.1", optional = true, features = ["fs"] }
ureq = { version = "3.5.1", optional = true }

[dev-dependencies]
flate2 = "1.1.11"
http-body-util = "0.1.5"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tower = { version = "0.5.3", features = ["util"] }

[[example]]
name = "minimal"
required-features = ["http", "health", "spa"]
