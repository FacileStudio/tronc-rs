[tools]
lefthook = "latest"

[hooks]
postinstall = "lefthook install"

[tasks.check]
description = "Run the full quality gate: rustfmt, clippy, tests, filet"
run = "sh ./scripts/check.sh"

[tasks.test]
description = "Run the tests only, every feature on"
run = "cargo test --all-features --locked"

[tasks.db-up]
description = "Start the scratch Postgres the database tests use, on port 5651"
run = "docker run -d --rm --name tronc-rs-testdb -e POSTGRES_PASSWORD=test -p 127.0.0.1:5651:5432 postgres:16-alpine"

[tasks.db-down]
description = "Stop the scratch Postgres"
run = "docker stop tronc-rs-testdb"
